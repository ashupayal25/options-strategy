[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otm-strategy"
version = "0.1.0"
description = "Signal-only Nifty weekly OTM option-selling regime app (no orders are placed)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "boto3>=1.34",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
otm = "otm_strategy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
